# ═══════════════════════════════════════════════════════════════
# Docker Compose — PRODUCTION
# Usage : docker compose -f docker-compose.prod.yml up --build -d
# ═══════════════════════════════════════════════════════════════

name: localizi-prod

services:

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    restart: always
    env_file: .env.prod          # NE JAMAIS committer ce fichier
    volumes:
      - uploads_prod:/app/uploads
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend/real_estate_front
      dockerfile: ../../Dockerfile.frontend
      args:
        VITE_API_URL: /api
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro    # certificats SSL (Let's Encrypt)
      - /var/www/certbot:/var/www/certbot:ro    # challenge ACME
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  uploads_prod:
    driver: local
    # En prod OVH : pointer vers un répertoire du serveur pour backup facile
    driver_opts:
      type: none
      o: bind
      device: /srv/localizi/uploads
