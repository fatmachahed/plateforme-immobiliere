name: localizi-prod

services:

  # ── Base de données PostgreSQL ─────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-localizi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-localizi_db}
    volumes:
      - postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localizi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend FastAPI ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-localizi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-localizi_db}
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend React (build statique servi par Nginx) ────────────
  frontend:
    build:
      context: ./frontend/real_estate_front
      dockerfile: ../../Dockerfile.frontend
      args:
        VITE_API_URL: /api
    restart: always

  # ── Reverse proxy Nginx (Cloudflare gère le SSL) ──────────────
  proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_prod:
  uploads_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/localizi/uploads
