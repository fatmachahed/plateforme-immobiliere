upstream backend  { server backend:8000;  keepalive 32; }
upstream frontend { server frontend:80;   keepalive 16; }

server {
    listen 80;
    server_name localizi.tn www.localizi.tn;

    client_max_body_size 50M;

    # API backend
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    # Sitemap XML dynamique (backend), servi à la racine pour les moteurs de recherche
    location = /sitemap.xml {
        proxy_pass         http://backend/sitemap.xml;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Images uploadées
    location /uploads/ {
        rewrite ^/uploads/(.*) /uploads/$1 break;
        proxy_pass   http://backend;
        expires      6M;
        add_header   Cache-Control "public";
    }

    # Frontend
    location / {
        proxy_pass       http://frontend;
        proxy_set_header Host $host;
    }
}
