# ── Nginx reverse proxy — Production avec SSL ─────────────────
# Remplacer votre-domaine.tn par votre vrai domaine

upstream backend  { server backend:8000;  keepalive 32; }
upstream frontend { server frontend:80;   keepalive 16; }

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name votre-domaine.tn www.votre-domaine.tn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name votre-domaine.tn www.votre-domaine.tn;

    # Certificats Let's Encrypt (gérés par Certbot)
    ssl_certificate     /etc/letsencrypt/live/votre-domaine.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.tn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Headers sécurité
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;

    client_max_body_size 50M;

    # ── API backend ──────────────────────────────────────────
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    # ── Images uploadées ─────────────────────────────────────
    location /uploads/ {
        rewrite ^/uploads/(.*) /uploads/$1 break;
        proxy_pass   http://backend;
        expires      6M;
        add_header   Cache-Control "public";
    }

    # Renouvellement Certbot (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Frontend ─────────────────────────────────────────────
    location / {
        proxy_pass       http://frontend;
        proxy_set_header Host $host;
    }
}
