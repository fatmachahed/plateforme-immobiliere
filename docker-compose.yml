# ═══════════════════════════════════════════════════════════════
# Docker Compose — DÉVELOPPEMENT
# Usage : docker compose up --build
# ═══════════════════════════════════════════════════════════════

name: localizi-dev

services:

  # ── Base de données PostgreSQL ────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-localizi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localizi_dev}
      POSTGRES_DB:       ${POSTGRES_DB:-localizi_db}
    ports:
      - "5432:5432"          # accès direct depuis l'hôte (pgAdmin, DBeaver…)
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localizi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend FastAPI (hot reload) ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-localizi}:${POSTGRES_PASSWORD:-localizi_dev}@db:5432/${POSTGRES_DB:-localizi_db}
    volumes:
      - ./backend:/app          # hot reload : le code source est monté
      - uploads_dev:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ── Frontend Vite (dev server) ────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./frontend/real_estate_front:/app
      - /app/node_modules          # isoler node_modules du volume hôte
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000   # le navigateur accède au backend directement
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_dev:
  uploads_dev:
