server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router : toutes les routes inconnues → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long terme pour les assets buildés (hash dans le nom)
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 6M;
        add_header Cache-Control "public";
    }

    # Pas de cache pour index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Service worker : JAMAIS de cache long — sinon un navigateur/CDN peut
    # continuer à servir une ancienne version pendant des mois après un
    # déploiement (notifications push, changement d'icône…), ce qui rend
    # l'installation de la PWA instable. `location =` (exact) prime toujours
    # sur les blocs regex ci-dessus, y compris celui des .js en cache 1 an.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Manifeste PWA : jamais de cache long non plus, pour la même raison.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Icônes de l'app : cache court avec revalidation — le nom de fichier ne
    # change jamais quand on change le logo, donc un cache long (6M) peut
    # bloquer Android/Chrome sur une icône périmée pendant des mois et
    # provoquer des installations qui échouent silencieusement.
    # `^~` : priorité sur le bloc regex image ci-dessus.
    location ^~ /icons/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
